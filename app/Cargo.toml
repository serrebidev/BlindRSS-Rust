[package]
name = "blindrss"
version = "0.1.84"
edition.workspace = true
license.workspace = true

# patois: this package's strings (and any translatable
# library's) are collected into po/blindrss.pot and the
# compiled catalogs are embedded in the binary.
[package.metadata.patois]
translatable = true

[dependencies]
blindrss-core = { path = "../crates/core" }
serde_json = "1"
libloading = "0.8.9"
# default-features = false for exactly one reason: wxdragon's
# defaults include wx-asserts, which builds wxWidgets with
# its internal consistency checks live — every failed check
# becomes a modal "debugging check" dialog for the end user,
# even in release builds (the class removed in
# Accessible-IPTV-Client-Rust v0.4.19, validation 0095
# there). Release wx builds compile those checks out, as
# wxPython ships. Every other default is re-enabled
# explicitly below, so the ONLY build change is the asserts.
wxdragon = { version = "0.9.24", default-features = false, features = ["media-ctrl", "richtext", "stc", "webview", "wx-printing", "wx-tiff", "wx-jpeg", "wx-tango-icons", "wx-extra-image-formats", "wx-regex", "appindicator"] }
ship-shape = "0.5.0"
# Gettext via patois (Brandon's order, 2026-11-07): catalogs
# live in po/, compile at build time, and embed in the binary
# — no locale folder ships and there are no downloadable
# translation updates anymore. The wx feature also carries
# wxWidgets' own stock-string catalogs on the same language.
patois = { version = "0.3", features = ["wx"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[build-dependencies]
shipfitter = { version = "0.2.4", features = ["windows-resources"] }
patois-build = "0.1"

[dev-dependencies]
# For the catalog lint tests (patois-build's check entry
# points) — the same crate the build script uses.
patois-build = "0.1"
