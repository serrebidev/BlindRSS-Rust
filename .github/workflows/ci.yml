name: CI

on:
  push:
    # A release tag points at a commit main's push already built;
    # release.yml gates every leg itself. Tag CI only held the
    # runners the release needed (v0.1.86).
    tags-ignore: ['**']
  pull_request:

# A superseded run is wasted wxWidgets build time, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # wxdragon-sys compiles wxWidgets from source on a cold cache.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install wxWidgets build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev pkg-config libgtk-3-dev libpng-dev libjpeg-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libexpat1-dev libtiff-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libwebkit2gtk-4.1-dev \
            libsecret-1-dev libnotify-dev libsdl2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-x \
            cmake ninja-build

      # patois-build shells out to msgfmt to compile the
      # translation catalogs it embeds; without gettext the
      # build silently ships no translations (the app's
      # patois guard tests fail loudly instead). macOS
      # runners ship msgfmt already. On Windows, the Git
      # for Windows userland provides msgfmt.exe but its
      # directory is not on PATH.
      - name: Install gettext (patois catalog compilation)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gettext

      - name: Install gettext (patois catalog compilation, Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          # inherit puts usr/bin on PATH for the cargo steps;
          # the default (minimal) only wires the msys2 shell.
          path-type: inherit
          install: gettext

      # setup-msys2 provisions its own tree under the runner
      # temp (D:/a/_temp/msys64) and path-type inherit does
      # not land its usr/bin on cargo's PATH; add it plainly.
      - name: Put msgfmt on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${RUNNER_TEMP}\\msys64\\usr\\bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package
          cache-on-failure: false

      # A restored rust-cache tree can lack the WebView2 SDK lib
      # (its download lives in the wx cmake tree, which the cache
      # round-trip drops) while cargo still treats wxdragon-sys
      # as fresh — the link then fails with LNK1104. When the
      # lib is absent, force the sys build script to re-run so
      # the SDK is downloaded again.
      - name: Restore WebView2 SDK if the cache dropped it (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! find target -name 'WebView2LoaderStatic.lib' 2>/dev/null | grep -q .; then
            echo "WebView2LoaderStatic.lib missing; cleaning wxdragon-sys to re-run its build script"
            cargo clean -p wxdragon-sys || true
            cargo clean -p wxdragon || true
          fi

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The VLC smoke test is ignored by default because most
      # machines have no libVLC; Linux CI installs it and runs
      # the test for real (owner-approved 2026-11-02).
      - name: VLC smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y vlc
          cargo test -p blindrss installed_vlc_plays_and_seeks_a_silent_wave -- --ignored
