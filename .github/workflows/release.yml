name: Release

on:
  push:
    tags: ["v*"]
  # Rebuild an existing tag (all three legs) and publish it.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish, e.g. v0.1.84
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install wxWidgets build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev pkg-config libgtk-3-dev libpng-dev libjpeg-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libexpat1-dev libtiff-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libwebkit2gtk-4.1-dev \
            libsecret-1-dev libnotify-dev libsdl2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-x \
            vlc ffmpeg

      # Same patois/gettext requirement as ci.yml: without
      # msgfmt the release binary ships no translations.
      - name: Install gettext (patois catalog compilation)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gettext

      - name: Install gettext (patois catalog compilation, Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          # inherit puts usr/bin on PATH for the cargo steps;
          # the default (minimal) only wires the msys2 shell.
          path-type: inherit
          install: gettext

      # setup-msys2 provisions its own tree under the runner
      # temp (D:/a/_temp/msys64) and path-type inherit does
      # not land its usr/bin on cargo's PATH; add it plainly.
      - name: Put msgfmt on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${RUNNER_TEMP}\\msys64\\usr\\bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false

      # Same guard as ci.yml: a restored cache can lack the
      # WebView2 SDK lib while wxdragon-sys looks fresh (LNK1104).
      - name: Restore WebView2 SDK if the cache dropped it (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! find target -name 'WebView2LoaderStatic.lib' 2>/dev/null | grep -q .; then
            echo "WebView2LoaderStatic.lib missing; cleaning wxdragon-sys to re-run its build script"
            cargo clean -p wxdragon-sys || true
            cargo clean -p wxdragon || true
          fi

      - name: Validate release
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

      - name: Build release binary
        run: cargo build --release --locked -p blindrss

      # Bundle libVLC in the layout the loader searches
      # (app/src/media_backend/vlc.rs, mirroring Python's
      # portable layout): libraries under vlc/lib (Linux,
      # macOS) or vlc (Windows), plugins under vlc/plugins.
      # Approved by the owner 2026-11-02 (gap 11 follow-up).
      - name: Bundle libVLC
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            mkdir -p dist/BlindRSS/vlc/lib dist/BlindRSS/vlc/plugins
            cp -L /usr/lib/x86_64-linux-gnu/libvlc.so.5 /usr/lib/x86_64-linux-gnu/libvlccore.so.* dist/BlindRSS/vlc/lib/
            cp -r /usr/lib/x86_64-linux-gnu/vlc/plugins/. dist/BlindRSS/vlc/plugins/
          elif [ "$RUNNER_OS" = "Windows" ]; then
            curl -fL -o vlc-win.zip https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.zip
            7z x vlc-win.zip -ovlc-win > /dev/null
            mkdir -p dist/BlindRSS/vlc/plugins
            cp vlc-win/vlc-3.0.21/libvlc.dll vlc-win/vlc-3.0.21/libvlccore.dll dist/BlindRSS/vlc/
            cp -r vlc-win/vlc-3.0.21/plugins/. dist/BlindRSS/vlc/plugins/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            curl -fL -o vlc.dmg https://download.videolan.org/pub/videolan/vlc/3.0.21/macosx/vlc-3.0.21-arm64.dmg
            hdiutil attach vlc.dmg -mountpoint "$RUNNER_TEMP/vlc-mnt" -nobrowse
            mkdir -p dist/BlindRSS/vlc/lib dist/BlindRSS/vlc/plugins
            cp -a "$RUNNER_TEMP/vlc-mnt/VLC.app/Contents/MacOS/lib/"libvlc*.dylib "$RUNNER_TEMP/vlc-mnt/VLC.app/Contents/MacOS/lib/"libvlccore*.dylib dist/BlindRSS/vlc/lib/
            cp -r "$RUNNER_TEMP/vlc-mnt/VLC.app/Contents/MacOS/plugins/." dist/BlindRSS/vlc/plugins/
            hdiutil detach "$RUNNER_TEMP/vlc-mnt"
          fi

      # Fixed ship-shape asset names (owner decision 2026-11-03,
      # BlindRadio's scheme): BlindRSS.zip (Windows),
      # BlindRSS.tar.gz (Linux), BlindRSS.dmg (macOS). Contents
      # sit at the archive root — ship-shape's Portable apply
      # extracts over the app folder with no top-folder stripping,
      # so a wrapping folder would nest the install.
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/BlindRSS
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/blindrss.exe dist/BlindRSS/
          else
            cp target/release/blindrss dist/BlindRSS/
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp app/assets/nvdaControllerClient.dll dist/BlindRSS/
            cp app/assets/nvdaControllerClient-LICENSE.txt dist/BlindRSS/
          fi
          cp README.md dist/BlindRSS/
          cp docs/PARITY.md dist/BlindRSS/
          mkdir -p dist/BlindRSS/sounds
          cp app/assets/sounds/*.wav dist/BlindRSS/sounds/
          mkdir -p dist/BlindRSS/docs
          cp -r docs/help dist/BlindRSS/docs/
          cp crates/core/assets/minisign.pub dist/BlindRSS/

      # Bundled tools in bin/, mirroring Python's build
      # (Audit 8 Task 23, landed at the owner's 2026-11-06
      # finish-everything order): the yt-dlp nightly binary and
      # Deno from the same URLs Python's build.bat/build.sh use,
      # ffmpeg copied from the build machine exactly as Python's
      # ensure_ffmpeg does (Linux apt / macOS brew). Windows has
      # no system ffmpeg to copy (Python's Windows build bundles
      # none and finds it at runtime), so the Windows leg stages
      # the gyan.dev static essentials build — that keeps the
      # packaged smoke below honest on every leg: all four tools
      # resolve from the package under a minimal PATH.
      - name: Bundle tools (bin/)
        shell: bash
        run: |
          mkdir -p dist/BlindRSS/bin
          YTDLP_BASE=https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download
          DENO_BASE=https://github.com/denoland/deno/releases/latest/download
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fL -o dist/BlindRSS/bin/yt-dlp.exe "$YTDLP_BASE/yt-dlp.exe"
            curl -fL -o deno.zip "$DENO_BASE/deno-x86_64-pc-windows-msvc.zip"
            7z x deno.zip -odeno-x > /dev/null
            cp deno-x/deno.exe dist/BlindRSS/bin/
            curl -fL -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            7z x ffmpeg.zip -offmpeg-x > /dev/null
            cp ffmpeg-x/*/bin/ffmpeg.exe ffmpeg-x/*/bin/ffprobe.exe dist/BlindRSS/bin/
          elif [ "$RUNNER_OS" = "Linux" ]; then
            curl -fL -o dist/BlindRSS/bin/yt-dlp "$YTDLP_BASE/yt-dlp_linux"
            curl -fL -o deno.zip "$DENO_BASE/deno-x86_64-unknown-linux-gnu.zip"
            unzip -o -j deno.zip deno -d deno-x > /dev/null
            cp deno-x/deno dist/BlindRSS/bin/
            cp /usr/bin/ffmpeg /usr/bin/ffprobe dist/BlindRSS/bin/
          else
            curl -fL -o dist/BlindRSS/bin/yt-dlp "$YTDLP_BASE/yt-dlp_macos"
            if [ "$(uname -m)" = "arm64" ]; then
              DENO_ASSET=deno-aarch64-apple-darwin.zip
            else
              DENO_ASSET=deno-x86_64-apple-darwin.zip
            fi
            curl -fL -o deno.zip "$DENO_BASE/$DENO_ASSET"
            unzip -o -j deno.zip deno -d deno-x > /dev/null
            cp deno-x/deno dist/BlindRSS/bin/
            command -v ffmpeg > /dev/null || brew install ffmpeg
            cp "$(command -v ffmpeg)" dist/BlindRSS/bin/ffmpeg
            cp "$(command -v ffprobe)" dist/BlindRSS/bin/ffprobe
          fi
          chmod +x dist/BlindRSS/bin/* 2>/dev/null || true
          ls -la dist/BlindRSS/bin/

      # Packaged smoke (Task 23): the staged binary must find
      # and run its bundled tools and pass the extraction check
      # with a minimal PATH — proving the shipped layout, not
      # the runner's toolchain. Runs before signing, so a broken
      # package never gets a signature.
      - name: Packaged smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PATH="/usr/bin:/bin:/c/Windows/System32:/c/Windows" ./dist/BlindRSS/blindrss.exe --blindrss-runtime-self-test
          else
            env -i PATH=/usr/bin:/bin HOME="$HOME" ./dist/BlindRSS/blindrss --blindrss-runtime-self-test
          fi

      - name: Archive
        shell: bash
        run: |
          cd dist/BlindRSS
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../BlindRSS.zip *
          elif [ "$RUNNER_OS" = "Linux" ]; then
            tar -czf ../BlindRSS.tar.gz *
          else
            cd ..
            # B14 (Audit 8 Task 30, landed with Task 23 at the
            # owner's 2026-11-06 order): assemble BlindRSS.app
            # from the staging folder and build the dmg from
            # the bundle folder, so the .app sits at the dmg
            # root and the fixed asset name holds.
            VERSION="${TAG#v}"
            cargo xtask bundle-app BlindRSS bundle "$VERSION"
            hdiutil create -volname BlindRSS -srcfolder bundle -ov -format UDZO BlindRSS.dmg
          fi

      # Every asset carries its minisign signature, so the
      # updater can verify the download (same pattern as
      # BlindRadio). The key lives in the MINISIGN_KEY
      # repository secret, never in git; MINISIGN_PASSWORD
      # unlocks it.
      - name: Sign release assets (minisign)
        shell: bash
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          files=$(ls dist/BlindRSS.zip dist/BlindRSS.tar.gz dist/BlindRSS.dmg 2>/dev/null || true)
          test -n "$files"
          echo "$files" | xargs cargo xtask sign

      - name: Upload artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: BlindRSS-${{ env.TAG }}-${{ runner.os }}
          path: |
            dist/BlindRSS.zip
            dist/BlindRSS.zip.minisig
            dist/BlindRSS.tar.gz
            dist/BlindRSS.tar.gz.minisig
            dist/BlindRSS.dmg
            dist/BlindRSS.dmg.minisig

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      # CHANGELOG.md at the tag supplies the release notes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A leg that failed must not publish: every asset and
      # its signature has to be there (BlindRadio's rule).
      - name: Verify every asset and signature arrived
        shell: bash
        run: |
          for wanted in BlindRSS.zip BlindRSS.zip.minisig BlindRSS.tar.gz BlindRSS.tar.gz.minisig BlindRSS.dmg BlindRSS.dmg.minisig; do
            test -f "artifacts/$wanted" || { echo "missing: $wanted"; exit 1; }
          done

      - name: Checksums
        run: cd artifacts && sha256sum *.zip *.tar.gz *.dmg *.minisig > SHA256SUMS

      # The release body is the tag's section of CHANGELOG.md
      # (BlindRadio's rule). A missing section fails the
      # publish instead of shipping GitHub's auto-generated
      # compare link as the notes.
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          python3 - "$TAG" <<'PY'
          import os, sys
          version = sys.argv[1].lstrip("v")
          head = f"## {version}"
          notes, inside = [], False
          for line in open("CHANGELOG.md").read().splitlines():
              if line.startswith("## "):
                  inside = line.strip() == head
                  if inside:
                      continue
                  if notes:
                      break
              if inside:
                  notes.append(line)
          notes = "\n".join(notes).strip()
          if not notes:
              sys.exit(f"no {head} section in CHANGELOG.md")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "notes.md"), "w") as f:
              f.write(notes + "\n")
          PY

      # Forgejo has no softprops action: reuse the tag's draft (or create
      # one), replace same-named assets, then publish it.
      - name: Publish the Forgejo release
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          h="Authorization: token $FORGEJO_TOKEN"
          notes="$RUNNER_TEMP/notes.md"
          if release="$(curl -sf -H "$h" "$api/releases/tags/$TAG")"; then
            id="$(echo "$release" | jq -r .id)"
            jq -n --rawfile body "$notes" --arg name "BlindRSS $TAG" '{name: $name, body: $body}' |
              curl -sf -o /dev/null -X PATCH -H "$h" -H 'Content-Type: application/json' -d @- "$api/releases/$id"
          else
            release="$(jq -n --rawfile body "$notes" --arg tag "$TAG" --arg name "BlindRSS $TAG" \
              '{tag_name: $tag, name: $name, body: $body, draft: true}' |
              curl -sf -H "$h" -H 'Content-Type: application/json' -d @- "$api/releases")"
            id="$(echo "$release" | jq -r .id)"
          fi
          for file in artifacts/*.zip artifacts/*.tar.gz artifacts/*.dmg artifacts/*.minisig artifacts/SHA256SUMS; do
            name="$(basename "$file")"
            old="$(echo "$release" | jq -r --arg n "$name" '.assets[]? | select(.name == $n) | .id')"
            [ -z "$old" ] || curl -sf -X DELETE -H "$h" "$api/releases/$id/assets/$old"
            curl -sf -o /dev/null -H "$h" -F "attachment=@$file" "$api/releases/$id/assets?name=$name"
            echo "Attached $name"
          done
          curl -sf -o /dev/null -X PATCH -H "$h" -H 'Content-Type: application/json' \
            -d '{"draft": false, "prerelease": false}' "$api/releases/$id"
          latest="$(curl -sf "$api/releases/latest" | jq -r .tag_name)"
          echo "/releases/latest is $latest"
          [ "$latest" = "$TAG" ]
